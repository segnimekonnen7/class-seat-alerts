    $(function () {

        $("#ddlyearTerm").change(function () {

            var selectedItem = $(this).val();

            var ddlDept = $("#ddlDepartment");

            var statesProgress = $("#Department-loading-progress");

            statesProgress.show();

            $.ajax({

                cache: false,

                type: "GET",

                url: "/ClassSchedule/Home/GetDepartment",

                data: { "yrtr": selectedItem },

                success: function (data) {

                    ddlDept.html('');

                    ddlDept.append('<option value="" >--- Select ---</option>');

                    $.each(data, function (id, option) {

                        ddlDept.append($('<option></option>').val(option.id).html(option.name));

                    });

                    statesProgress.hide();

                },

                error: function (xhr, ajaxOptions, thrownError) {

                    alert('Failed to retrieve model.');

                    statesProgress.hide();

                }

            });

        });

    });





</script>
